repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]

  # pyright needs this project's real environment (CKAN and its dependencies
  # actually installed) to resolve imports meaningfully, not an isolated
  # pre-commit env, so it runs via the already-activated interpreter on PATH.
  # A bare "python" resolves differently (and wrongly) through pyright's own
  # lookup than through the shell's — pass the resolved absolute path instead.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: bash -c 'npx pyright --pythonpath="$(command -v python)"'
        language: system
        types: [python]
        pass_filenames: false

      # Runs via the already-installed node_modules on PATH, same assumption
      # this repo's other JS tooling (gulp, tsc) already makes — not an
      # isolated pre-commit env.
      - id: vitest
        name: vitest (tables-tabulator)
        entry: npm test
        language: system
        files: ^(ckanext/tables/assets/ts/|tests-js/|vitest\.config\.ts$)
        pass_filenames: false
