{% ckan_extends %}

{% block header_account_logged %}
    {% if g.userobj.sysadmin %}
        {% if ui is defined %}
            {{ ui.account_nav_item(_("Demo Dashboard"), h.url_for("tables_demo.dashboard"), icon="table") }}
        {% else %}
            <li>
                <a href="{{ h.url_for('tables_demo.dashboard') }}" title="{{ _('Demo Dashboard') }}">
                    <i class="fa fa-table-columns" aria-hidden="true"></i>
                </a>
            </li>
        {% endif %}
    {% endif %}

    {{ super() }}
{% endblock %}
