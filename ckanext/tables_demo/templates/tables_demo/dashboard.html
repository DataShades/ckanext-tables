{% extends "tables/base.html" %}


{% block page_content %}
    <div class="pt-2 ckanext-datapreview">
        {% if page_title %}
            <h1>{{ page_title }}</h1>
        {% endif %}

        {% for table in tables %}
            <h2 class="mt-4">{{ table.name.replace('_', ' ')|title }}</h2>
            {% snippet "tables/render_table.html", table=table %}
        {% endfor %}
    </div>
{% endblock page_content %}
