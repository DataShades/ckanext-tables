version: 1
groups:
  - annotation: Cache settings
    description: >
      These options control how downloaded resource data is cached.
      They apply to file-based Resource Data Sources (CSV, XLSX, ORC, Parquet, Feather).
    options:
      - key: ckanext.tables.cache.backend
        default: "feather"
        allowed_values:
          - pickle
          - redis
          - parquet
          - feather
        description: |
          The storage backend used to cache downloaded table data.

          - **`pickle`** — data is cached as pickle files on disk. Simple and requires no additional
            infrastructure. The cache directory is controlled by
            `ckanext.tables.cache.cache_dir`.
          - **`redis`** — data is stored in Redis using CKAN's built-in Redis connection.
            Suitable for multi-worker deployments where shared cache is needed.
          - **`parquet`** — data is cached as Apache Parquet files on disk. Scales well for
            large DataFrames. The cache directory is controlled by `ckanext.tables.cache.cache_dir`.
          - **`feather`** — data is cached as Arrow IPC (Feather) files on disk. Optimised for
            fast read/write speed with minimal serialisation overhead.
            The cache directory is controlled by `ckanext.tables.cache.cache_dir`.

          Unknown values fall back to `feather` with a warning in the logs.
        example: "redis"

      - key: ckanext.tables.cache.cache_dir
        default: "<ckan.storage_path>/tables-cache"
        description: |
          Directory where cache files are stored. Used for file-based cache backends.

          If the directory does not exist it is created automatically, with permissions
          restricted to the CKAN process user (mode `0700`). If it already exists but is
          owned by another user, or is writable by other users/groups, it is refused and
          table caching is disabled (a warning is logged) rather than falling back to a
          shared, predictable location such as the system temp directory — a shared or
          attacker-owned cache directory would let another local user plant a file that
          gets read back as trusted cache data (notably by the `pickle` backend).

          !!! Note
              It's recommended to set this directory to a persistent location with appropriate
              permissions, e.g. `%(ckan.storage_path)s/tables-cache` in your CKAN config — which
              is also the default when `ckan.storage_path` is configured.

        example: "/var/cache/ckanext-tables"

      - key: ckanext.tables.cache.ttl
        default: 3600
        description: |
          Time-to-live (in seconds) for cached data. After this period, cached
          entries are considered stale and will be re-fetched from the original source.

          This value is used as the default for all cache backends and data sources.
          Individual data source instances can still override the TTL programmatically.
        example: 86400

  - annotation: Remote fetch settings
    description: >
      These options control how the file-based Resource Data Sources (CSV, XLSX, ORC, Parquet,
      Feather) download data from a resource's `url` or a resource view's `file_url` override.
      Both are set by dataset editors, not sysadmins, but are fetched by the CKAN server process,
      so downloads are guarded against SSRF (requests to private/loopback/link-local/internal
      addresses are refused), hangs (connect/read timeouts), and unbounded response bodies
      (a maximum size, enforced while streaming).
    options:
      - key: ckanext.tables.fetch.connect_timeout
        default: 5
        description: |
          Maximum time (in seconds) to wait for a connection to the remote host to be established
          before giving up.
        example: 5

      - key: ckanext.tables.fetch.read_timeout
        default: 30
        description: |
          Maximum time (in seconds) to wait between bytes received from the remote host before
          giving up.
        example: 30

      - key: ckanext.tables.fetch.max_bytes
        default: 209715200
        description: |
          Maximum response size (in bytes) accepted from a remote resource/`file_url`. Enforced
          both from the `Content-Length` response header and while streaming the body, so a
          server that lies about or omits `Content-Length` cannot bypass it. Defaults to 200 MB.
        example: 209715200
